name: Build Android APK

# Manual trigger, or automatically on every push to dev.
on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GODOT_VERSION: "4.7-stable"
      # Godot expects the template folder to be named <major>.<minor>.<status>.mono
      GODOT_TPL_DIR: "4.7.stable.mono"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 and 9
        uses: actions/setup-dotnet@v4
        with:
          # The game project targets net8.0 normally but net9.0 when
          # GodotTargetPlatform == android, while compat packs are net8.0.
          # Both SDKs are required.
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-v1

      - name: Install Godot mono editor + Android export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"

          # Note: the archive is named ..._mono_linux_x86_64.zip but the binary
          # inside is ..._mono_linux.x86_64 (underscore before mono, not a dash).
          GODOT_BIN="$(find "$HOME/godot" -type f -name 'Godot_v*' ! -name '*.zip' | head -1)"
          if [ -z "$GODOT_BIN" ]; then
            echo "Downloading Godot editor..."
            curl -fsSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
            unzip -q -o /tmp/godot.zip -d "$HOME/godot"
            GODOT_BIN="$(find "$HOME/godot" -type f -name 'Godot_v*' ! -name '*.zip' | head -1)"
          fi

          echo "--- extracted tree ---"
          find "$HOME/godot" -maxdepth 2 | head -20

          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot binary not found after extraction."
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version || true

          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TPL_DIR}"
          if [ ! -f "$TPL_DIR/android_debug.apk" ] && [ ! -f "$TPL_DIR/android_source.zip" ]; then
            echo "Downloading export templates..."
            curl -fsSL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_export_templates.tpz"
            rm -rf /tmp/tpl && mkdir -p /tmp/tpl
            unzip -q -o /tmp/templates.tpz -d /tmp/tpl
            mkdir -p "$TPL_DIR"
            cp -r /tmp/tpl/templates/. "$TPL_DIR/"
          fi
          echo "--- templates dir ---"
          ls -1 "$TPL_DIR" | head -20

      - name: Locate Android SDK / JDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          ls -1 "$SDK" || true
          ls -1 "$SDK/ndk" 2>/dev/null || true

      - name: Generate debug signing key
        run: |
          set -euo pipefail
          KS="$HOME/debug.keystore"
          if [ ! -f "$KS" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore "$KS" -storepass android -validity 9999 \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          fi
          echo "DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Configure Godot editor settings for Android export
        run: |
          set -euo pipefail
          CFG_DIR="$HOME/.config/godot"
          CFG_FILE="$CFG_DIR/editor_settings-4.tres"
          mkdir -p "$CFG_DIR"
          # Written with printf so no leading indentation ends up in the .tres,
          # which would make Godot fail to parse it.
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$DEBUG_KEYSTORE\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            'export/android/force_system_user = false' \
            'export/android/shutdown_adb_on_exit = true' \
            > "$CFG_FILE"
          cat "$CFG_FILE"

      - name: Provide powershell shim (project MSBuild targets call powershell.exe)
        run: |
          set -euo pipefail
          # gemuera-c#.csproj shells out to "powershell ..." during publish, and
          # pwsh on Linux cannot load the desktop-only System.IO.Compression.FileSystem
          # assembly that script uses. The shim handles the .aar extraction in
          # python3 and delegates anything else to pwsh.
          sudo install -m 0755 tools/ci/powershell-shim.sh /usr/local/bin/powershell
          /usr/local/bin/powershell -NoProfile -Command '"shim passthrough OK: " + $PSVersionTable.PSVersion.ToString()'

      - name: Build first-party compat packs (required before export)
        shell: pwsh
        run: |
          ./tools/compat-pack/Build-FirstPartyPacks.ps1 -ProjectRoot .
          echo "--- staged packs ---"
          Get-ChildItem -Recurse compat_packs -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Import project and build C# solutions
        run: |
          set -euo pipefail
          # Import assets + compile C#; Godot sometimes hangs on exit in headless mode,
          # so cap it and verify the DLL afterwards.
          timeout 1800 "$GODOT_BIN" --headless --path . --import --quit || true
          timeout 1800 "$GODOT_BIN" --headless --path . --build-solutions --quit || true
          echo "--- compiled assemblies ---"
          find .godot/mono/temp/bin -name '*.dll' 2>/dev/null | head -20 || true

      - name: Diagnose .NET publish for android-arm64
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "=== dotnet --list-sdks ==="
          dotnet --list-sdks
          echo "=== dotnet --list-runtimes ==="
          dotnet --list-runtimes
          echo "=== workloads ==="
          dotnet workload list || true
          echo
          echo "=== direct publish (same args Godot uses) ==="
          dotnet publish "gemuera-c#.csproj" \
            -c ExportDebug -r android-arm64 --self-contained true -v normal \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:GodotTargetPlatform=android \
            -o /tmp/pre-publish 2>&1 | tail -60

      - name: Export debug APK
        run: |
          set -uo pipefail
          mkdir -p build
          # Godot 4.7 mono can segfault while shutting down in headless mode even
          # when the export itself succeeded, so the exit code is not trusted.
          # Success is decided by whether the APK actually exists.
          timeout 3600 "$GODOT_BIN" --headless --path . --verbose \
            --install-android-build-template \
            --export-debug "Android" "$PWD/build/gemuera.apk" 2>&1 | tee /tmp/export.log
          echo "godot exit: $?"
          echo "--- tail of export log ---"
          tail -40 /tmp/export.log

          if [ ! -f build/gemuera.apk ]; then
            echo "::error::No APK was produced. Relevant errors:"
            grep -iE "error|fail|exception" /tmp/export.log | tail -40 || true
            exit 1
          fi
          ls -la build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gemuera-debug-apk
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
