name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GODOT_VERSION: "4.7-stable"
      GODOT_TPL_DIR: "4.7.stable.mono"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the versionCode is derived from the commit count so that
          # every build is newer than the last one and Android accepts it as an
          # update.
          fetch-depth: 0

      - name: Set up .NET 8 and 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stamp versionCode from commit count
        run: |
          set -euo pipefail
          COUNT=$(git rev-list --count HEAD)
          # Base 1400 sits well above the 14 currently in export_presets.cfg, so
          # this build is always an upgrade over the previously installed APK.
          CODE=$((1400 + COUNT))
          echo "versionCode=${CODE} (commit count ${COUNT})"
          sed -i "s|^version/code=.*|version/code=${CODE}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"1.10.0-gemuera.${CODE}\"|" export_presets.cfg
          grep -E '^version/(code|name)=' export_presets.cfg

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.GEMUERA_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.GEMUERA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GEMUERA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.GEMUERA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/gemuera.jks"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASS"
            ALIAS="$KEY_ALIAS"
            KPASS="${KEY_PASS:-$KEYSTORE_PASS}"
            echo "::notice::Signing with the permanent key (alias $ALIAS) from repository secrets."
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            # Bootstrap run: create the key once and publish it as an artifact so
            # it can be stored as GEMUERA_KEYSTORE_BASE64. Without that secret
            # every run would sign with a different key and refuse to install as
            # an update.
            echo "::warning::GEMUERA_KEYSTORE_BASE64 is not set. Generating a keystore for this run. Download the gemuera-keystore artifact and store it as GEMUERA_KEYSTORE_BASE64 (plus PASSWORD/ALIAS/PASSWORD secrets) so later builds keep the same signature."
            ALIAS=gemuera
            PASS=gemuera-keystore-pass
            KPASS="$PASS"
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$KPASS" \
              -dname "CN=gEmuera, OU=Tim-ui-boop, O=gEmuera, C=US"
            base64 -w0 "$KS" > "$RUNNER_TEMP/keystore.b64"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
          keytool -list -keystore "$KS" -storepass "$PASS" | grep -i "Your keystore contains" || true
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_STORE_PASS=$PASS"
            echo "KEYSTORE_ALIAS=$ALIAS"
            echo "KEYSTORE_KEY_PASS=$KPASS"
          } >> "$GITHUB_ENV"

      - name: Publish keystore (first run only)
        if: steps.signing.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gemuera-keystore
          path: ${{ runner.temp }}/keystore.b64
          if-no-files-found: error
          retention-days: 90

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-v1

      - name: Install Godot mono editor + Android export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"

          # The archive is named ..._mono_linux_x86_64.zip but the binary inside
          # is ..._mono_linux.x86_64 (underscore before mono, not a dash).
          GODOT_BIN="$(find "$HOME/godot" -type f -name 'Godot_v*' ! -name '*.zip' | head -1)"
          if [ -z "$GODOT_BIN" ]; then
            echo "Downloading Godot editor..."
            curl -fsSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
            unzip -q -o /tmp/godot.zip -d "$HOME/godot"
            GODOT_BIN="$(find "$HOME/godot" -type f -name 'Godot_v*' ! -name '*.zip' | head -1)"
          fi

          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot binary not found after extraction."
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version || true

          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TPL_DIR}"
          if [ ! -f "$TPL_DIR/android_debug.apk" ] && [ ! -f "$TPL_DIR/android_source.zip" ]; then
            echo "Downloading export templates..."
            curl -fsSL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_export_templates.tpz"
            rm -rf /tmp/tpl && mkdir -p /tmp/tpl
            unzip -q -o /tmp/templates.tpz -d /tmp/tpl
            mkdir -p "$TPL_DIR"
            cp -r /tmp/tpl/templates/. "$TPL_DIR/"
          fi
          ls -1 "$TPL_DIR" | head -10

      - name: Locate Android SDK / JDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "SDK=$SDK"

      - name: Configure Godot editor settings for Android export
        run: |
          set -euo pipefail
          CFG_DIR="$HOME/.config/godot"
          CFG_FILE="$CFG_DIR/editor_settings-4.tres"
          mkdir -p "$CFG_DIR"
          # Written with printf so no leading indentation ends up in the .tres,
          # which would make Godot fail to parse it.
          # The debug keystore slot is pointed at the permanent key, so every
          # build carries the same signature and installs as an update.
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$KEYSTORE_PATH\"" \
            "export/android/debug_keystore_user = \"$KEYSTORE_ALIAS\"" \
            "export/android/debug_keystore_pass = \"$KEYSTORE_KEY_PASS\"" \
            'export/android/force_system_user = false' \
            'export/android/shutdown_adb_on_exit = true' \
            > "$CFG_FILE"
          cat "$CFG_FILE"

      - name: Provide powershell shim (project MSBuild targets call powershell.exe)
        run: |
          set -euo pipefail
          # gemuera-c#.csproj shells out to "powershell ..." during publish, and
          # pwsh on Linux cannot load the desktop-only System.IO.Compression.FileSystem
          # assembly that script uses. The shim handles the .aar extraction in
          # python3 and delegates anything else to pwsh.
          sudo install -m 0755 tools/ci/powershell-shim.sh /usr/local/bin/powershell
          /usr/local/bin/powershell -NoProfile -Command '"shim passthrough OK: " + $PSVersionTable.PSVersion.ToString()'

      - name: Build first-party compat packs (required before export)
        shell: pwsh
        run: |
          ./tools/compat-pack/Build-FirstPartyPacks.ps1 -ProjectRoot .
          Get-ChildItem -Recurse compat_packs -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Import project and build C# solutions
        run: |
          set -euo pipefail
          timeout 1800 "$GODOT_BIN" --headless --path . --import --quit || true
          timeout 1800 "$GODOT_BIN" --headless --path . --build-solutions --quit || true
          find .godot/mono/temp/bin -name '*.dll' 2>/dev/null | head -10 || true

      - name: Export debug APK
        run: |
          set -uo pipefail
          mkdir -p build
          # Godot 4.7 mono reliably segfaults while shutting down in headless mode
          # *after* the export reports DONE (malloc(): invalid size in the mono
          # finalizer). Its exit code therefore carries no information, so it is
          # captured and ignored; success is decided by the APK existing.
          rc=0
          timeout 3600 "$GODOT_BIN" --headless --path . \
            --install-android-build-template \
            --export-debug "Android" "$PWD/build/gemuera.apk" \
            > /tmp/export.log 2>&1 || rc=$?
          echo "godot exit code: $rc (non-zero is expected at shutdown)"
          tail -15 /tmp/export.log

          if [ ! -f build/gemuera.apk ]; then
            echo "::error::No APK was produced."
            grep -iE "error|fail|exception" /tmp/export.log | tail -30 || true
            exit 1
          fi
          echo "APK: $(du -h build/gemuera.apk | cut -f1)"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/gemuera.apk | head -12
          else
            echo "apksigner not found; skipping verification"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gemuera-debug-apk
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
